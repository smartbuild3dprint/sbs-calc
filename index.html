  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--concrete);
    color:var(--ink);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:112px;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--black);outline-offset:2px;}

  .wrap{max-width:560px;margin:0 auto;}

  /* ——— шапка ——— */
  .head{
    position:relative;
    background:var(--white);
    padding:14px var(--pad) 0;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .smart{
    position:absolute;right:0;bottom:35px;width:92px;height:118px;
    object-fit:cover;object-position:top center;
    display:block;pointer-events:none;z-index:1;
  }
  .head h1,.head p,.wordmark{position:relative;padding-right:96px;}
  .wordmark{
    font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--black);
  }
  .head h1{
    font-size:25px;font-weight:800;letter-spacing:-.02em;
    margin:8px 0 2px;line-height:1.15;
  }
  .head p{margin:0 0 14px;color:var(--grey);font-size:13.5px;}

  /* ——— вкладки ——— */
  .tabs{
    position:relative;z-index:2;background:var(--white);
    display:flex;gap:19px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    padding:0 0 11px;white-space:nowrap;font-size:14.5px;
    font-weight:600;color:var(--grey);
    border-bottom:3px solid transparent;margin-bottom:-1px;
  }
  .tab[aria-selected="true"]{color:var(--black);border-bottom-color:var(--yellow);}

  /* ——— секции ——— */
  .sec{padding:20px var(--pad) 0;}
  .lead{margin:0 0 18px;color:var(--grey);font-size:14px;}
  .label{font-size:13px;font-weight:600;color:var(--grey);margin:0 0 9px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:9px 15px;background:var(--white);
    border:1.5px solid var(--line);border-radius:3px;
    font-weight:600;font-variant-numeric:tabular-nums;
    transition:border-color .12s,background .12s;
  }
  .chip[aria-pressed="true"]{border-color:var(--black);background:var(--black);color:var(--white);}

  .slider-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .slider-val{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .slider-unit{color:var(--grey);font-size:14px;font-weight:600;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);}
  input[type=range]::-moz-range-track{height:2px;background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:var(--black);border:5px solid var(--yellow);margin-top:-11px;
  }
  input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;border:5px solid var(--yellow);background:var(--black);
  }
  .hint{font-size:12.5px;color:var(--grey);margin:2px 0 0;}

  /* ——— блок цены: слои печати ——— */
  .price{
    margin:22px 0 0;background:var(--white);
    border:1.5px solid var(--black);border-radius:3px;overflow:hidden;
  }
  .price-layers{
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.045) 0px, rgba(0,0,0,.045) 1px,
      transparent 1px, transparent 7px);
    padding:18px var(--pad) 16px;
  }
  .price-row + .price-row{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .price-cap{font-size:12.5px;font-weight:600;color:var(--grey);}
  .price-num{
    font-size:29px;font-weight:800;letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;
  }
  .price-tier{font-size:13px;color:var(--ink);margin-top:3px;}
  .price-rate{font-size:12.5px;color:var(--grey);}
  .price-bar{height:5px;background:var(--yellow);}

  /* ——— факты ——— */
  .facts{display:flex;gap:8px;margin-top:14px;}
  .fact{
    flex:1;background:var(--white);border:1px solid var(--line);
    border-radius:3px;padding:11px 10px;
  }
  .fact b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;}
  .fact span{display:block;font-size:11.5px;color:var(--grey);margin-top:3px;line-height:1.3;}

  /* ——— аккордеон ——— */
  .acc{margin-top:14px;background:var(--white);border:1px solid var(--line);border-radius:3px;}
  .acc-item + .acc-item{border-top:1px solid var(--line);}
  .acc-head{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding:14px var(--pad);text-align:left;font-weight:600;font-size:14px;
  }
  .acc-sign{font-size:19px;font-weight:400;color:var(--grey);line-height:1;flex-shrink:0;}
  .acc-body{padding:0 var(--pad) 15px;font-size:13.5px;}
  .acc-body[hidden]{display:none;}
  .acc-body ul{margin:0;padding:0;list-style:none;}
  .acc-body li{position:relative;padding-left:17px;margin-bottom:6px;color:var(--ink);}
  .acc-body li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:2px;background:var(--black);}
  .acc-body .out li::before{background:var(--line);}
  .acc-body .out li{color:var(--grey);}
  .acc-sub{font-size:12.5px;font-weight:600;color:var(--grey);margin:0 0 7px;}
  .acc-sub + ul{margin-bottom:14px;}

  /* ——— заметка ——— */
  .note{
    margin-top:14px;background:var(--white);
    border:1px solid var(--line);border-left:4px solid var(--yellow);
    border-radius:3px;padding:14px var(--pad);
  }
  .note b{display:block;font-size:14px;margin-bottom:5px;}
  .note p{margin:0;font-size:13.5px;color:var(--grey);}

  /* ——— каталог ——— */
  .cat-group{margin-top:18px;}
  .cat-group > p{font-size:13px;font-weight:700;margin:0 0 9px;}
  .cat-list{background:var(--white);border:1px solid var(--line);border-radius:3px;}
  .cat-row{display:flex;justify-content:space-between;gap:12px;padding:12px var(--pad);}
  .cat-row + .cat-row{border-top:1px solid var(--line);}
  .cat-row b{font-weight:600;font-size:14px;}
  .cat-row small{display:block;color:var(--grey);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .cat-spec{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .cat-spec b{font-size:13.5px;}
  .cat-spec small{font-size:12px;}

  /* ——— оговорка ——— */

  .vid{margin-top:16px;background:var(--black);border-radius:3px;overflow:hidden;}
  .vid video{
    display:block;width:100%;height:auto;max-height:300px;
    aspect-ratio:4/3;object-fit:cover;object-position:center 42%;
    background:var(--black);
  }
  .vid p{margin:0;padding:10px var(--pad);font-size:12px;color:#9A9A96;}

  .rate{
    margin-top:16px;background:var(--white);border:1.5px solid var(--black);
    border-radius:3px;overflow:hidden;
  }
  .rate-in{
    padding:16px var(--pad);
    background-image:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.045) 0px,rgba(0,0,0,.045) 1px,transparent 1px,transparent 7px);
  }
  .rate-num{font-size:27px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;}
  .rate-sub{font-size:13px;color:var(--grey);margin-top:6px;}
  .rate-bar{height:5px;background:var(--yellow);}

  .cat-row{align-items:center;}
  .cat-img{
    width:58px;height:58px;flex-shrink:0;border-radius:3px;
    background-color:var(--white);background-repeat:no-repeat;
    background-image:var(--sprite);background-size:290px 232px;
  }
  .cat-main{flex:1;min-width:0;}
  .cat-weight{
    flex-shrink:0;align-self:center;font-size:15px;font-weight:800;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .cat-price{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;}

  .disclaimer{
    margin:22px 0 0;background:var(--black);color:var(--white);
    border-radius:3px;padding:16px var(--pad);
  }
  .disclaimer p{margin:0;font-size:13.5px;line-height:1.5;}
  .disclaimer .extra{
    margin-top:11px;padding-top:11px;border-top:1px solid #333;
    font-size:13px;color:var(--yellow);
  }
  .disclaimer .offer{margin-top:9px;font-size:11.5px;color:#9A9A96;}

  /* ——— контакты ——— */
  .contacts{margin-top:14px;display:grid;gap:8px;}
  .contact{
    display:flex;align-items:center;gap:13px;
    background:var(--white);border:1.5px solid var(--line);border-radius:3px;
    padding:13px var(--pad);text-decoration:none;
  }
  .contact:first-child{border-color:var(--black);background:var(--yellow);}
  .contact .ic{
    width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;
  }
  .contact .ic svg{width:19px;height:19px;}
  .contact b{display:block;font-size:14.5px;font-weight:700;}
  .contact span{display:block;font-size:12px;color:var(--grey);}
  .contact:first-child span{color:#5C4B00;}

  .copy{
    margin-top:8px;width:100%;padding:13px;background:var(--white);

  .copy.done{border-color:var(--black);}

  .foot{
    margin-top:22px;padding:16px var(--pad) 26px;
    border-top:1px solid var(--line);text-align:center;
  }
  .foot a{font-size:13.5px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--yellow);}
  .foot p{margin:8px 0 0;font-size:11.5px;color:var(--grey);}

  /* ——— закреплённая кнопка ——— */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--white);border-top:1px solid var(--line);
    padding:11px var(--pad) calc(11px + env(safe-area-inset-bottom));
  }
  .sticky-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .sticky-sum{flex:1;min-width:0;}
  .sticky-sum b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;

  .sticky-sum span{display:block;font-size:11.5px;color:var(--grey);}
  .sticky-btn{

  .stub h2{font-size:19px;font-weight:800;margin:0 0 8px;}

  .stub .fallback a{display:block;margin-top:6px;font-weight:600;}

  .localbar{
    background:var(--black);color:#E8E8E4;font-size:11.5px;

  }
  @media (max-width:359px){
    .smart{width:78px;height:102px;}

    .head h1{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  var DATA = null;
  var local = false;
  var state = { cat:0, area:null, floors:null, open:{} };
  var app = document.getElementById("app");

  var nf = new Intl.NumberFormat("ru-RU");
  function money(n){ return nf.format(Math.round(n)) + " \u20BD"; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  /* ——— загрузка данных ——— */
  function load(){
    app.innerHTML = '<div class="stub"><p>Загружаем расчёт…</p></div>';
    fetch("data.json?v=" + Date.now(), { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(d){
        if (!d || !d.categories || !d.categories.length) throw new Error("empty");
        DATA = d; resetCat(0); render();
      })
      .catch(function(){ embedded(); });
  }

  function embedded(){
    var el = document.getElementById("embedded-data");
    try {
      var d = JSON.parse(el.textContent);
      if (!d || !d.categories || !d.categories.length) throw new Error("empty");
      DATA = d; local = true; resetCat(0); render();
    } catch(e){ stub(); }
  }

  function stub(){
    app.innerHTML =
      '<div class="stub">' +
        '<h2>Данные не загрузились</h2>' +
        '<p>Проверьте соединение и попробуйте ещё раз.</p>' +
        '<button type="button" id="retry">Повторить</button>' +
        '<div class="fallback">Или свяжитесь с нами напрямую:' +
          '<a href="tel:+79036292377">8 (903) 629-23-77</a>' +
          '<a href="https://t.me/SaleSmartBuild_Service">@SaleSmartBuild_Service</a>' +
          '<a href="mailto:info@sbsmsk.ru">info@sbsmsk.ru</a>' +
        '</div>' +
      '</div>';
    document.getElementById("retry").addEventListener("click", load);
  }

  function cat(){ return DATA.categories[state.cat]; }

  function resetCat(i){
    state.cat = i; state.open = {};
    var c = DATA.categories[i];
    state.area = c.default_area || null;
    state.floors = c.default_floors || null;
  }

  /* ——— расчёт ——— */
  function calc(){
    var c = cat();
    if (c.mode === "catalog" || !c.tiers) return null;
    var t = c.tiers.map(function(tier){
      return { name:tier.name, rate:tier.price_m2, from:!!tier.from, total:tier.price_m2 * state.area };
    });
    t.sort(function(a,b){ return a.total - b.total; });
    return t;
  }

  /* ——— рендер ——— */
  function render(){
    var c = cat(), m = DATA.meta;
    var h = "";

    if (local) h += '<div class="localbar">Файл открыт локально: данные из встроенной копии. ' +
      'Правки в data.json появятся после загрузки на хостинг.</div>';

    h += '<header class="head">' +
      '<div class="wordmark">' + esc(m.brand) + '</div>' +
      '<h1>' + esc(m.title) + '</h1>' +
      '<p>' + esc(m.subtitle) + '</p>' +
      '<img class="smart" src="' + SMART + '" alt="СМАРТ, маскот Smart Build Service" width="90">' +
      '<div class="tabs" role="tablist">' +
        DATA.categories.map(function(x,i){
          return '<button class="tab" role="tab" data-tab="' + i + '" aria-selected="' +
            (i === state.cat) + '">' + esc(x.tab) + '</button>';
        }).join("") +
      '</div></header>';

    h += '<div class="sec">';
    h += '<p class="lead">' + esc(c.lead) + '</p>';

    if (c.mode === "area_fixed") h += blockFixed(c);
    else if (c.mode === "area_range") h += blockRange(c);

    var rows = calc();
    if (rows) h += blockPrice(rows, c);

    if (c.video) h += blockVideo(c.video);
    if (c.rate_kg) h += blockRate(c);
    if (c.facts) h += blockFacts(c.facts);
    if (c.extra_note) h += blockNote(c.extra_note);
    if (c.tiers) h += blockAcc(c);
    if (c.note) h += blockNote(c.note);
    if (c.mode === "catalog") h += blockCatalog(c);

    h += blockContacts(m);
    h += '</div>';

    h += '<footer class="foot">' +
      '<a href="' + esc(m.site.href) + '" target="_blank" rel="noopener">' + esc(m.site.label) + '</a>' +
      '<p>' + esc(m.brand) + '</p></footer>';

    app.innerHTML = h;
    renderSticky(rows, c);
    bind();
  }

  function blockFixed(c){
    return '<p class="label">Площадь модуля</p><div class="chips">' +
      c.areas.map(function(a){
        return '<button class="chip" data-area="' + a + '" aria-pressed="' +
          (a === state.area) + '">' + a + ' ' + c.unit + '</button>';
      }).join("") + '</div>';
  }

  function blockRange(c){
    var h = '<p class="label">Площадь объекта</p>' +
      '<div class="slider-row"><span class="slider-val">' + nf.format(state.area) +
      '</span><span class="slider-unit">' + c.unit + '</span></div>' +
      '<input type="range" id="area" min="' + c.area_min + '" max="' + c.area_max +
      '" step="' + c.area_step + '" value="' + state.area + '" aria-label="Площадь объекта">' +
      '<p class="hint">' + esc(c.area_hint) + '</p>';
    if (c.floors) {
      h += '<p class="label" style="margin-top:18px">Этажность</p><div class="chips">' +
        c.floors.map(function(f){
          return '<button class="chip" data-floors="' + f + '" aria-pressed="' +
            (f === state.floors) + '">' + f + '</button>';
        }).join("") + '</div>';
    }
    return h;
  }

  function blockPrice(rows, c){
    var h = '<div class="price"><div class="price-layers">';
    rows.forEach(function(r){
      h += '<div class="price-row">' +
        '<div class="price-cap">' + esc(r.name) + '</div>' +
        '<div class="price-num">' + (r.from ? "от " : "") + money(r.total) + '</div>' +
        '<div class="price-tier"><span class="price-rate">' + (r.from ? "от " : "") +
          nf.format(r.rate) + ' \u20BD за ' + c.unit + '</span></div>' +
        '</div>';
    });
    h += '</div><div class="price-bar"></div></div>';
    return h;
  }

      '<source src="' + esc(v.src) + '" type="video/mp4"></video>' +
      '<p>' + esc(v.caption) + '</p></div>';
  }

  function blockRate(c){
    var r = c.rate_kg;
    return '<div class="rate"><div class="rate-in">' +
      '<div class="price-cap">Печать</div>' +
      '<div class="rate-num">' + nf.format(r.min) + ' – ' + nf.format(r.max) + ' \u20BD за ' + r.unit + '</div>' +
      '<div class="rate-sub">' + esc(c.price_note.text) + '</div>' +
      '</div><div class="rate-bar"></div></div>';
  }

  function blockFacts(facts){
    return '<div class="facts">' + facts.map(function(f){
      return '<div class="fact"><b>' + esc(f.value) + '</b><span>' + esc(f.label) + '</span></div>';
    }).join("") + '</div>';
  }

  function blockAcc(c){
    var h = '<div class="acc">';
    c.tiers.forEach(function(t, i){
      var key = "t" + i, open = !!state.open[key];
      h += '<div class="acc-item">' +
        '<button class="acc-head" data-acc="' + key + '" aria-expanded="' + open + '">' +
          '<span>Что входит: ' + esc(t.name) + '</span>' +
          '<span class="acc-sign">' + (open ? "\u2212" : "+") + '</span></button>' +
        '<div class="acc-body"' + (open ? "" : " hidden") + '><ul>' +
          t.includes.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") +
        '</ul></div></div>';
    });
    if (c.excludes) {
      var ok = !!state.open.ex;
      h += '<div class="acc-item">' +
        '<button class="acc-head" data-acc="ex" aria-expanded="' + ok + '">' +
          '<span>Что не входит</span><span class="acc-sign">' + (ok ? "\u2212" : "+") + '</span></button>' +
        '<div class="acc-body"' + (ok ? "" : " hidden") + '><ul class="out">' +
          c.excludes.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") +
        '</ul></div></div>';
    }
    return h + '</div>';
  }

  function blockNote(n){
    return '<div class="note"><b>' + esc(n.title) + '</b><p>' + esc(n.text) + '</p></div>';
  }

  function blockCatalog(c){
    var groups = [];
    c.items.forEach(function(it){
      var g = groups.filter(function(x){ return x.name === it.group; })[0];
      if (!g) { g = { name:it.group, items:[] }; groups.push(g); }
      g.items.push(it);
    });
    var r = c.rate_kg;
    return groups.map(function(g){
      return '<div class="cat-group"><p>' + esc(g.name) + '</p><div class="cat-list">' +
        g.items.map(function(it){
          var pos = it.sprite
            ? ' style="background-position:-' + (it.sprite[0]*58) + 'px -' + (it.sprite[1]*58) + 'px"'
            : '';
          var price = r
            ? '<div class="cat-price">' + nf.format(it.weight * r.min) + ' – ' +
              nf.format(it.weight * r.max) + ' \u20BD</div>'
            : '';
          return '<div class="cat-row">' +
            '<span class="cat-img"' + pos + ' role="img" aria-label="' + esc(it.name) + '"></span>' +
            '<div class="cat-main"><b>' + esc(it.name) + '</b>' +
            '<small>' + nf.format(it.h) + ' \u00D7 ' + nf.format(it.w) + ' \u00D7 ' +
            nf.format(it.l) + ' мм</small>' + price + '</div>' +
            '<div class="cat-weight">' + nf.format(it.weight) + ' кг</div></div>';
        }).join("") + '</div></div>';
    }).join("");
  }

  function blockContacts(m){
    var icons = {
      phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
      telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7 8.5-7.7c.4-.3-.1-.5-.6-.2L6.2 13.1l-4.5-1.4c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.5.2 1.2 1.4z"/></svg>',
      channel:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7 8.5-7.7c.4-.3-.1-.5-.6-.2L6.2 13.1l-4.5-1.4c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.5.2 1.2 1.4z"/></svg>',
      email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4.5" width="20" height="15" rx="2"/><path d="m2.5 6.5 9.5 7 9.5-7"/></svg>'
    };
    var extra = cat().disclaimer_extra
      ? '<p class="extra">' + esc(cat().disclaimer_extra) + '</p>' : '';
    return '<div class="disclaimer"><p>' + esc(DATA.meta.disclaimer) + '</p>' + extra +
      '<p class="offer">' + esc(DATA.meta.offer_note) + '</p></div>' +
      '<div class="contacts">' + m.contacts.map(function(ct){
        return '<a class="contact" href="' + esc(ct.href) + '"' +
          (ct.type === "telegram" ? ' target="_blank" rel="noopener"' : '') + '>' +
          '<span class="ic">' + (icons[ct.type] || "") + '</span>' +
          '<span><b>' + esc(ct.label) + '</b><span>' + esc(ct.hint) + '</span></span></a>';
      }).join("") + '</div>' +
      '<button class="copy" type="button" id="copy">Скопировать расчёт для менеджера</button>';
  }

  function renderSticky(rows, c){
    var old = document.querySelector(".sticky");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "sticky";
    var sum = rows
      ? '<b>' + money(rows[0].total) + ' \u2013 ' + money(rows[rows.length - 1].total) + '</b>' +
        '<span>' + state.area + ' ' + c.unit + ', предварительно</span>'
      : '<b>' + nf.format(c.rate_kg.min) + ' – ' + nf.format(c.rate_kg.max) +
        ' \u20BD за кг</b><span>печать, ' + c.items.length + ' позиций в каталоге</span>';
    el.innerHTML = '<div class="sticky-in"><div class="sticky-sum">' + sum +
      '</div><button class="sticky-btn" type="button" id="go">Связаться</button></div>';
    document.body.appendChild(el);
    document.getElementById("go").addEventListener("click", function(){
      var d = document.querySelector(".disclaimer");
      if (d) d.scrollIntoView({ behavior:"smooth", block:"start" });
    });
  }

  function summary(){
    var c = cat(), rows = calc(), s = c.name;
    if (rows) {
      s += ", " + state.area + " " + c.unit;
      if (state.floors) s += ", " + state.floors + " эт.";
      s += "\n" + rows.map(function(r){
        return r.name + ": " + (r.from ? "от " : "") + money(r.total);
      }).join("\n");
    } else {
      s += ": печать " + cat().rate_kg.min + "–" + cat().rate_kg.max + " ₽/кг, нужен детальный расчёт";
    }
    return s + "\nРасчёт предварительный, прошу связаться для детального.";
  }

  /* ——— события ——— */
  function bind(){
    document.querySelectorAll("[data-tab]").forEach(function(b){
      b.addEventListener("click", function(){
        resetCat(+b.dataset.tab); render(); window.scrollTo(0, 0);
      });
    });
    document.querySelectorAll("[data-area]").forEach(function(b){
      b.addEventListener("click", function(){ state.area = +b.dataset.area; render(); });
    });
    document.querySelectorAll("[data-floors]").forEach(function(b){
      b.addEventListener("click", function(){ state.floors = +b.dataset.floors; render(); });
    });
    document.querySelectorAll("[data-acc]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.acc;
        state.open[k] = !state.open[k]; render();
      });
    });

    var slider = document.getElementById("area");
    if (slider) {
      slider.addEventListener("input", function(){
        state.area = +slider.value;
        var v = document.querySelector(".slider-val");
        if (v) v.textContent = nf.format(state.area);
        var rows = calc();
        document.querySelectorAll(".price-num").forEach(function(el, i){
          if (rows[i]) el.textContent = (rows[i].from ? "от " : "") + money(rows[i].total);
        });
        var st = document.querySelector(".sticky-sum b");
        if (st && rows) st.textContent = money(rows[0].total) + " \u2013 " + money(rows[rows.length-1].total);
        var sl = document.querySelector(".sticky-sum span");
        if (sl) sl.textContent = state.area + " " + cat().unit + ", предварительно";
      });
    }

    var copy = document.getElementById("copy");
    if (copy) {
      copy.addEventListener("click", function(){
        var text = summary();
        var done = function(){
          copy.textContent = "Расчёт скопирован";
          copy.classList.add("done");
          setTimeout(function(){
            copy.textContent = "Скопировать расчёт для менеджера";
            copy.classList.remove("done");
          }, 2200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallbackCopy);
        } else { fallbackCopy(); }
        function fallbackCopy(){
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch(e){}
          document.body.removeChild(ta);
        }
      });
    }
  }

  load();
})();
</script>
